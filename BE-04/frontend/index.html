<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth: Login &amp; Protect</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --border: #2e2e2e;
    --text: #ffffff;
    --muted: #8a8a8a;
    --ok: #ffffff;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--muted);
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-pill.active .status-dot { background: var(--ok); }
  .status-pill.active { color: var(--text); border-color: #4a4a4a; }

  main {
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
  }
  .section {
    margin-bottom: 28px;
  }
  .section h2 {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .section p.hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 12px;
  }
  input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  input:focus {
    outline: none;
    border-color: #666;
  }
  button {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:focus-visible { outline: 2px solid #666; outline-offset: 2px; }
  button.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.link {
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    font-weight: 400;
    padding: 0;
    width: auto;
  }
  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .actions-grid button { margin-bottom: 0; }

  .view { display: none; }
  .view.active { display: block; }

  .result {
    margin-top: 4px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    color: #d0d0d0;
    display: none;
  }
  .result.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>Auth · Login &amp; Protect</h1>
  <p>FastAPI + Supabase Auth demo — sign up, log in, and call protected routes below.</p>
  <div id="statusPill" class="status-pill">
    <span class="status-dot"></span>
    <span id="statusText">No active session</span>
  </div>
</header>

<main>
  <div class="card">

    <!-- SIGNUP VIEW -->
    <div id="view-signup" class="view active">
      <div class="section">
        <h2>Sign Up</h2>
        <input id="signupEmail" type="email" placeholder="email@example.com">
        <input id="signupPassword" type="password" placeholder="password">
        <button onclick="signup()">Create account</button>
        <button class="link" onclick="showView('login')">Already have an account? Log in</button>
      </div>
      <div class="section">
        <h2>Public route</h2>
        <p class="hint">No login required.</p>
        <button class="ghost" onclick="getPublicInfo()">Get public info</button>
        <div id="result-signup" class="result"></div>
      </div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="view-login" class="view">
      <div class="section">
        <h2>Log In</h2>
        <input id="loginEmail" type="email" placeholder="email@example.com">
        <input id="loginPassword" type="password" placeholder="password">
        <button onclick="login()">Log in</button>
        <button class="link" onclick="showView('signup')">Need an account? Sign up</button>
        <div id="result-login" class="result"></div>
      </div>
      <div class="section">
        <h2>Public route</h2>
        <p class="hint">No login required.</p>
        <button class="ghost" onclick="getPublicInfo()">Get public info</button>
      </div>
    </div>

    <!-- APP VIEW (post-login) -->
    <div id="view-app" class="view">
      <div class="section">
        <h2>Protected actions</h2>
        <p class="hint">These calls send your access token automatically.</p>
        <div class="actions-grid">
          <button class="ghost" onclick="getProfile()">Get profile</button>
          <button class="ghost" onclick="getDashboard()">Dashboard</button>
        </div>
        <div id="result-app" class="result"></div>
      </div>
      <div class="section">
        <h2>Public route</h2>
        <button class="ghost" onclick="getPublicInfo()">Get public info</button>
      </div>
      <div class="section">
        <button onclick="logout()">Log out</button>
      </div>
    </div>

  </div>
</main>

<script>
  const API_BASE = "http://localhost:8000";
  let accessToken = null;

  function showView(name) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function setStatus(active, text) {
    const pill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    pill.classList.toggle("active", active);
    statusText.textContent = text;
  }

  function showResult(targetId, data) {
    const el = document.getElementById(targetId);
    el.textContent = JSON.stringify(data, null, 2);
    el.classList.add("show");
  }

  async function callApi(method, path, body, useAuth) {
    const headers = { "Content-Type": "application/json" };
    if (useAuth && accessToken) {
      headers["Authorization"] = "Bearer " + accessToken;
    }
    const res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
    let data;
    try {
      data = await res.json();
    } catch {
      data = {};
    }
    return { status: res.status, data };
  }

  async function signup() {
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;
    const { status, data } = await callApi("POST", "/auth/signup", { email, password }, false);
    showResult("result-signup", data);
    if (status === 201) {
      document.getElementById("loginEmail").value = email;
      showView("login");
    }
  }

  async function login() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const { status, data } = await callApi("POST", "/auth/login", { email, password }, false);
    showResult("result-login", data);
    if (status === 200 && data.access_token) {
      accessToken = data.access_token;
      setStatus(true, "Logged in — token active");
      showView("app");
    }
  }

  async function getPublicInfo() {
    const { data } = await callApi("GET", "/public/info", null, false);
    const visible = ["result-signup", "result-login", "result-app"].find(id => {
      const view = document.getElementById(id).closest(".view");
      return view && view.classList.contains("active");
    });
    if (visible) showResult(visible, data);
  }

  async function getProfile() {
    const { data } = await callApi("GET", "/protected/profile", null, true);
    showResult("result-app", data);
  }

  async function getDashboard() {
    const { data } = await callApi("GET", "/protected/dashboard", null, true);
    showResult("result-app", data);
  }

  async function logout() {
    const { status } = await callApi("POST", "/auth/logout", null, true);
    if (status === 204) {
      accessToken = null;
      setStatus(false, "No active session");
      showView("login");
    }
  }
</script>

</body>
</html>
